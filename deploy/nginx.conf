server {
    listen 80;
    server_name desert-walker.ru;

    root /var/www/desert-walker;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /textures/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
